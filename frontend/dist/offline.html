<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SurplusSync - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      width: 80px;
      height: 80px;
      background: #16a34a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .icon svg {
      width: 40px;
      height: 40px;
      fill: white;
    }
    .icon.checking {
      background: #3b82f6;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    h1 {
      color: #166534;
      font-size: 24px;
      margin-bottom: 12px;
    }
    h1.checking {
      color: #1e40af;
    }
    p {
      color: #4b5563;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    button {
      background: #16a34a;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #15803d;
    }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .status {
      font-size: 14px;
      color: #6b7280;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon" id="icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
      </svg>
    </div>
    <h1 id="title">You're Offline</h1>
    <p id="message">SurplusSync needs an internet connection to load fresh data. Please check your connection and try again.</p>
    <button id="retryBtn" onclick="tryReconnect()">Try Again</button>
    <div class="status" id="status"></div>
  </div>

  <script>
    // Event-driven reconnection (no polling loops)
    
    // Auto-detect when connection is restored
    window.addEventListener('online', function() {
      handleOnline();
    });

    // Check if already online when page loads
    if (navigator.onLine) {
      checkConnection();
    }

    function handleOnline() {
      document.getElementById('icon').classList.add('checking');
      document.getElementById('title').textContent = 'Connection Restored!';
      document.getElementById('title').classList.add('checking');
      document.getElementById('message').textContent = 'Reloading the app...';
      document.getElementById('status').textContent = 'Reconnecting...';
      
      // Reload to main app
      setTimeout(function() {
        window.location.replace('/');
      }, 500);
    }

    function tryReconnect() {
      var btn = document.getElementById('retryBtn');
      btn.disabled = true;
      btn.textContent = 'Checking...';
      document.getElementById('status').textContent = 'Checking connection...';
      
      checkConnection();
    }

    function checkConnection() {
      // Check connection using health endpoint with no-cors to avoid CORS issues
      fetch('/health', { 
        method: 'GET',
        cache: 'no-cache',
        signal: AbortSignal.timeout(5000)
      })
      .then(function(response) {
        if (response.ok) {
          // Connection successful - reload to main app
          handleOnline();
        } else {
          showStillOffline();
        }
      })
      .catch(function(error) {
        // Still offline
        showStillOffline();
      });
    }

    function showStillOffline() {
      var btn = document.getElementById('retryBtn');
      btn.disabled = false;
      btn.textContent = 'Try Again';
      document.getElementById('status').textContent = 'Still offline. Please check your connection.';
      
      // Clear status after a few seconds
      setTimeout(function() {
        document.getElementById('status').textContent = '';
      }, 3000);
    }
    
    // NO POLLING - Event-driven only!
  </script>
</body>
</html>
